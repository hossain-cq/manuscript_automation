name: manuscript-system
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pyyaml>=6.0
  - pip:
      - langgraph>=0.2
      - langgraph-checkpoint-sqlite>=2.0
      - pydantic>=2.7
      - pydantic-settings>=2.4
      - openai>=1.40
      - python-dotenv>=1.0
      - requests>=2.31
      - pandas>=2.0
      - matplotlib>=3.7
      - numpy>=1.24
      - pytest>=8.0
      - langgraph-cli[inmem]>=0.4  # `langgraph dev` - local LangGraph Studio server
      - bibtexparser>=1.4,<2.0  # BibTeX parsing for manuscript_evaluation.py
